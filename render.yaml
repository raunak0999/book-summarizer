services:
  # --- Backend FastAPI Web Service ---
  - type: web
    name: book-agent-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: book-agent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CHAT_PROVIDER
        value: groq
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "768"

  # --- Frontend Next.js Web Service ---
  - type: web
    name: book-agent-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: book-agent-backend
          property: host

databases:
  # --- Render PostgreSQL Database ---
  - name: book-agent-db
    databaseName: bookagent
